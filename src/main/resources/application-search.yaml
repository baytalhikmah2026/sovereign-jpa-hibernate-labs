spring:
  jpa:
    properties:
      hibernate:
        search:
          enabled: true
          schema_management:
            strategy: drop-and-create-and-drop
          indexing:
            plan:
              synchronization:
                strategy: sync
          backend:
            directory:
              root: target/search-index
            indexes:
              products:
                sharding:
                  strategy: hash
                  number_of_shards: 4

spring:
  application:
    name: sovereign-persistence
  config:
    import: optional:file:./config/vault-approle.yaml
  datasource:
    hikari:
      pool-name: SovereignPool
      maximum-pool-size: 10
      minimum-idle: 10
      connection-timeout: 3000
      max-lifetime: 1800000
      leak-detection-threshold: 2000
      connection-init-sql: set lock_timeout = 2000
      transaction-isolation: TRANSACTION_READ_COMMITTED
      data-source-properties:
        reWriteBatchedInserts: true
        prepareThreshold: 3
        preparedStatementCacheQueries: 256
  cloud:
    vault:
      enabled: false
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:db/functions.sql
        - classpath:db/audit-indexes.sql
  jpa:
    defer-datasource-initialization: true
    open-in-view: false
    properties:
      org:
        hibernate:
          envers:
            store_data_at_delete: true
            revision_on_collection_change: false
      jakarta:
        persistence:
          query:
            timeout: 5000
      hibernate:
        cache:
          use_second_level_cache: false
        search:
          enabled: false
        jdbc:
          batch_size: 50
        order_inserts: true
        query:
          plan_cache_max_size: 2048
    hibernate:
      ddl-auto: create-drop
      naming:
        physical-strategy: com.baytalhikmah.sovereign.persistence.SovereignNamingStrategy

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,persistence

decorator:
  datasource:
    p6spy:
      enable-logging: true
      logging: slf4j
      log-format: "%(executionTime) ms | %(category) | %(sqlSingleLine)"

resilience4j:
  circuitbreaker:
    instances:
      catalogue-db:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 2s
        permitted-number-of-calls-in-half-open-state: 2
        ignore-exceptions:
          - com.baytalhikmah.sovereign.persistence.RecordNotFoundException

logging:
  level:
    p6spy: info

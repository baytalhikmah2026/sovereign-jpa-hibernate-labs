spring:
  application:
    name: sovereign-persistence
  config:
    import: optional:file:./config/vault-approle.yaml
  datasource:
    hikari:
      pool-name: SovereignPool
      maximum-pool-size: 10
      minimum-idle: 10
      connection-timeout: 3000
      max-lifetime: 1800000
      leak-detection-threshold: 2000
      data-source-properties:
        reWriteBatchedInserts: true
  cloud:
    vault:
      enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:db/functions.sql
  jpa:
    defer-datasource-initialization: true
    open-in-view: false
    properties:
      jakarta:
        persistence:
          query:
            timeout: 5000
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
    hibernate:
      ddl-auto: create-drop
      naming:
        physical-strategy: com.baytalhikmah.sovereign.persistence.SovereignNamingStrategy

decorator:
  datasource:
    p6spy:
      enable-logging: true
      logging: slf4j
      log-format: "%(executionTime) ms | %(category) | %(sqlSingleLine)"

logging:
  level:
    p6spy: info

services:

  postgres:
    image: pgvector/pgvector:0.8.7-pg18
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_DB: sovereign
      POSTGRES_USER: sovereign_admin
      POSTGRES_PASSWORD: local-admin-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./scripts:/scripts:ro
      - ./snapshots:/snapshots
      - ./certs:/certs
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sovereign_admin", "-d", "sovereign"]
      interval: 5s
      retries: 10

  vault:
    image: hashicorp/vault:2.2.1
    command: server -dev
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: local-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - ./scripts:/scripts:ro
      - ./config:/config

  redis:
    image: redis:8.10.3
    ports:
      - "127.0.0.1:6379:6379"

  kafka:
    image: apache/kafka:4.1.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:9092:9092"

  connect:
    image: quay.io/debezium/connect:3.7.1.Final
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: sovereign-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      - kafka
      - postgres

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"

  postgres-replica:
    image: pgvector/pgvector:0.8.7-pg18
    user: postgres
    command: sh /scripts/replica-start.sh
    environment:
      PRIMARY_HOST: postgres
      PGPASSWORD: replica-local-only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./scripts:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy

  audit-shipper:
    image: alpine:3.22
    command: sh /scripts/audit-shipper.sh
    volumes:
      - ./scripts:/scripts:ro
      - ./logs/audit:/audit:ro
      - ./worm:/worm

  crdb1:
    image: cockroachdb/cockroach:v26.3.5
    command: start --insecure --join=crdb1:26257,crdb2:26257,crdb3:26257 --advertise-addr=crdb1:26257 --locality=region=eu-west --cache=.25 --max-sql-memory=.25
    ports:
      - "127.0.0.1:26257:26257"
      - "127.0.0.1:8090:8080"

  crdb2:
    image: cockroachdb/cockroach:v26.3.5
    command: start --insecure --join=crdb1:26257,crdb2:26257,crdb3:26257 --advertise-addr=crdb2:26257 --locality=region=us-east --cache=.25 --max-sql-memory=.25
    ports:
      - "127.0.0.1:26258:26257"

  crdb3:
    image: cockroachdb/cockroach:v26.3.5
    command: start --insecure --join=crdb1:26257,crdb2:26257,crdb3:26257 --advertise-addr=crdb3:26257 --locality=region=ap-south --cache=.25 --max-sql-memory=.25
    ports:
      - "127.0.0.1:26259:26257"
